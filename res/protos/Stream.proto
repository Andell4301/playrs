    string url = 12;
  }

  int32 artwork_type = 1;
  Dimensions dimensions = 2;
  string url = 5;
  string alt_text = 6;
  string https_url = 7;
  int32 sequence_position = 8;
  bool is_fife_url_supported = 9;
  Citation citation = 10;
  int32 duration_in_seconds = 14;
  string fill_color_hex = 15;
  bool is_autogenerated = 16;
  ArtworkAttribution attribution = 17;
  string background_color_hex = 19;
  ColorPalette color_palette = 20;
  int32 device_type = 21;
  bool is_fife_monogram_supported = 22;
  string alternate_url = 28;
}

message ArtworkAttribution {
  string source_name = 1;
  string source_url = 2;
  string license_name = 3;
  string license_url = 4;
}

message ColorPalette {
  string light_vibrant = 1;
  string vibrant = 2;
  string dark_vibrant = 3;
  string light_muted = 4;
  string muted = 5;
  string dark_muted = 6;
}

message StringWrapper {
  string data = 1;
}

message UrlWrapper {
  string url = 1;
  string id = 2;
}

message Timestamp {
  uint64 seconds = 1;
  uint32 nanos = 2;
}

message TimestampWrapper {
  Timestamp timestamp = 1;
}

message TimestampEntry {
  string entry = 1;
  Timestamp timestamp = 2;
}

message TimestampEntryWrapper {
  string android_id = 1;
  TimestampEntry entry = 2;
}

message NestedTimestamp {
  TimestampWrapper wrapper = 1;
  Timestamp timestamp = 2;
}

message TimestampContainer {
  TimestampEntryWrapper entry_wrapper = 3;
  NestedTimestamp nested_timestamp = 6;
}
